name: Build release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: easyprint-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Set up build environment
        shell: pwsh
        run: |
          python -m venv venv
          ./venv/Scripts/python.exe -m pip install -r requirements.txt -r build_requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Regression tests (no physical printing)
        shell: pwsh
        run: |
          ./venv/Scripts/python.exe -B -m unittest discover -s scripts -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Build and verify
        shell: pwsh
        run: ./scripts/build_release.ps1
      - name: Create draft release (publish after review)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = Get-Content src/version.py -Raw
          $version = [regex]::Match($source, 'APP_VERSION = "([0-9.]+)"').Groups[1].Value
          gh release create "v$version" "dist/EasyPrint-$version-windows-x64.zip" "dist/EasyPrint-$version-windows-x64.zip.sha256" --draft --target $env:GITHUB_SHA --title "EasyPrint $version" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
